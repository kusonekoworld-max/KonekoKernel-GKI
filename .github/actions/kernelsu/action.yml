name: Setup KernelSU-Next
description: Download and configure KernelSU-Next with dynamic SELinux compatibility fix

inputs:
  ksu_branch:
    description: 'KernelSU branch or commit (empty = latest dev-susfs branch tip)'
    required: false
    default: ""

runs:
  using: composite
  steps:
    - name: Download KernelSU-Next
      shell: bash
      working-directory: ${{ github.workspace }}/kernel
      run: |
        set -euo pipefail

        KSU_REPO="https://github.com/pershoot/KernelSU-Next.git"
        KSU_INPUT="${{ inputs.ksu_branch }}"

        if [ -z "$KSU_INPUT" ]; then
          KSU_INPUT="dev-susfs"
        fi

        if git ls-remote --heads "$KSU_REPO" "$KSU_INPUT" | grep -q .; then
          echo "Using KernelSU-Next branch: $KSU_INPUT"

          curl -LSs \
            "https://raw.githubusercontent.com/pershoot/KernelSU-Next/dev-susfs/kernel/setup.sh" \
            | bash -s dev-susfs

          git -C KernelSU-Next/kernel fetch --depth=50 origin "$KSU_INPUT"
          git -C KernelSU-Next/kernel checkout "origin/$KSU_INPUT"
        else
          echo "Using KernelSU-Next commit: $KSU_INPUT"

          curl -LSs \
            "https://raw.githubusercontent.com/pershoot/KernelSU-Next/dev-susfs/kernel/setup.sh" \
            | bash -s dev-susfs

          git -C KernelSU-Next/kernel fetch --depth=50 origin "$KSU_INPUT"
          git -C KernelSU-Next/kernel checkout "$KSU_INPUT"
        fi

        cd KernelSU-Next/kernel

        COMMITS_COUNT=$(/usr/bin/git rev-list --count HEAD)
        BASE_VERSION=30000
        KSU_VERSION=$(expr "$COMMITS_COUNT" + "$BASE_VERSION")

        sed -i \
          "s/^KSU_VERSION_FALLBACK := 1$/KSU_VERSION_FALLBACK := ${KSU_VERSION}/" \
          Kbuild

        KSU_GIT_TAG="$(git describe --tags --abbrev=0 2>/dev/null || echo "v0.0.1")"

        sed -i \
          "s/^KSU_VERSION_TAG_FALLBACK := v0.0.1$/KSU_VERSION_TAG_FALLBACK := ${KSU_GIT_TAG}/" \
          Kbuild

    - name: Extract KSU Version Info
      id: ksu-version
      shell: bash
      working-directory: ${{ github.workspace }}/kernel/KernelSU-Next
      run: |
        set -euo pipefail

        git fetch --depth=50 origin dev 2>/dev/null || true

        KSU_GIT_VERSION=$(git rev-list --count origin/dev 2>/dev/null || echo 0)
        KSU_GIT_TAG=$(git describe --tags --abbrev=0 origin/dev 2>/dev/null || echo "")
        KSU_COMMIT=$(git rev-parse --short origin/dev 2>/dev/null || git rev-parse --short HEAD)

        KSU_VERSION=$((30000 + KSU_GIT_VERSION))

        echo "KSU_GIT_TAG=$KSU_GIT_TAG" >> "$GITHUB_ENV"
        echo "KSU_VERSION=$KSU_VERSION" >> "$GITHUB_ENV"
        echo "KSU_COMMIT=$KSU_COMMIT" >> "$GITHUB_ENV"

        echo "KSU_GIT_TAG=$KSU_GIT_TAG"
        echo "KSU_VERSION=$KSU_VERSION"
        echo "KSU_COMMIT=$KSU_COMMIT"

    - name: Fix selinux_hide pointer-bool conversion
      shell: bash
      run: |
        set -euo pipefail

        FOUND=0

        while IFS= read -r -d '' f; do
          FOUND=1

          echo "[*] Checking $f"

          if grep -q "extern void security_dump_masked_av_fn" "$f"; then
            sed -i \
              's/if (security_dump_masked_av_fn)/if (\&security_dump_masked_av_fn)/g' \
              "$f"

            sed -i \
              's/if (security_dump_masked_av_fn != NULL)/if (\&security_dump_masked_av_fn != NULL)/g' \
              "$f"

            sed -i \
              's/if (context_struct_compute_av_fn)/if (\&context_struct_compute_av_fn)/g' \
              "$f"

            sed -i \
              's/if (context_struct_compute_av_fn != NULL)/if (\&context_struct_compute_av_fn != NULL)/g' \
              "$f"

            echo "[+] Patched function-form selinux_hide.c"

          elif grep -q "if (security_dump_masked_av_fn" "$f"; then
            sed -i \
              's/if (security_dump_masked_av_fn)/if (security_dump_masked_av_fn != NULL)/g' \
              "$f"

            sed -i \
              's/if (context_struct_compute_av_fn)/if (context_struct_compute_av_fn != NULL)/g' \
              "$f"

            echo "[+] Patched pointer-form selinux_hide.c"

          else
            echo "[*] No compatibility change required"
          fi

        done < <(
          find "${{ github.workspace }}/kernel" \
            -path '*/kernel/feature/selinux_hide.c' \
            -type f \
            -print0
        )

        if [ "$FOUND" -eq 0 ]; then
          echo "[*] No selinux_hide.c found"
        fi

    - name: Enable Kernel Configs
      uses: ./.github/actions/set-kernel-config
      with:
        config_list: |
          CONFIG_KSU=y